<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chewy&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="Utility.css">
    
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: "Google Sans", sans-serif;
        }

        body {
            height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .header {
            height: 65px;
            width: 100%;
        }

        .logo {
            display: flex;
            position: absolute;
            margin-left: 20px;
            height: 100px;
            width: 100px;
        }

        .svg {
            height: 24px;
            width: 24px;
            cursor: pointer;
            background-color: rgba(128, 128, 128, 0.299);
            border-radius: 50%;
            padding: 12px;
        }

        .svg1 {
            height: 24px;
            width: 24px;
            cursor: pointer;
            border-radius: 50%;
        }

        .middle {
            width: 65%;
            margin-left: auto;
        }

        .middle-first {
            gap: 6px;
        }

        .search {
            background-color: rgba(128, 128, 128, 0.299);
            border-radius: 25px;
            padding: 12px;
            width: 400px;

        }

        #input {
            background-color: transparent;
            border: none;
            outline: none;
            color: white;
            font: 20px;
            margin-left: 10px;
            width: 90%;
            height: 100%;
        }

        .right {
            width: 80%;
            justify-content: center;
            gap: 20px;
        }

        .explore {
            background-color: white;
            border: none;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        .install {
            background-color: rgba(128, 128, 128, 0.289);
            color: white;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
        }

        #acc {
            background-color: #1DB954;
            color: black;
            height: 32px;
            width: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin-left: 20px;
        }

        .main-content {
            height: 78vh;
            width: 100%;
            gap: 10px;
            box-sizing: border-box;
        }

        .slidebar {
            width: 24%;
            height: 78vh;
            background-color: #1918188f;
            border-radius: 10px;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
            box-sizing: border-box;
        }

        .top h3 {
            font-size: 15px;
        }

        .create {
            background-color: #1DB954;
            border: none;
            color: black;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: auto;
            margin-right: 10px;
        }

        .option {
            background-color: rgba(128, 128, 128, 0.179);
            border: none;
            color: rgb(255, 255, 255);
            font-size: 14px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-right: 10px;
        }

        .recents {
            gap: 10px;
            cursor: pointer;
        }

        .svg-search {
            height: 24px;
            width: 24px;
            cursor: pointer;
            border-radius: 50%;
        }

        .recent {
            font-size: 14px;
            margin-left: auto;
        }

        .recent img {
            height: 16px;
            width: 16px;
            margin-left: 5px;
        }

        ul {
            display: flex;
            flex-direction: column;
            row-gap: 10px;
            list-style: none;
            height: auto;
            width: 100%;
        }

        .artist {
            display: flex;
            height: 100%;
            gap: 10px;
            cursor: pointer;
        }

        .artist-cover {
            height: 50px;
            width: 50px;
            border-radius: 50px;
        }

        .description {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contents {
            width: 70%;
            flex: 1;
            border-radius: 10px;
            flex-direction: column;
            padding: 16px 42px;
            gap: 20px;
            background-color: #181818;
            overflow: auto;
        }

        .recommended,
        .popular-songs {
            flex-direction: column;
            height: auto;
            width: 100%;
            border-radius: 10px;
            row-gap: 20px;
        }

        .footer {
            height: 28vh;
            width: 100%;
        }

        .footer-content {
            width: 90%;
            justify-content: space-between;
        }

        .footer-left {
            width: 10%;
            flex-direction: column;
            row-gap: 3px;
        }

        .footer-center {
            display: flex;
            flex-direction: column;
            width: 80%;
            justify-content: center;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;

        }

        .song-time {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .footer-right {
            display: flex;
            width: 10%;
            align-items: center;
            gap: 10px;
        }


        #song-name {
            font-size: 14px;
            display: inline;
        }

        #artist-name {
            font-size: 12px;
            display: inline;
        }

        .music {
            position: relative;
            display: flex;
            flex-direction: column;
            row-gap: 5px;
            height: 180px;
            width: 180px;
            border-radius: 10px;
            cursor: pointer;
            padding-bottom: 20px;
        }

        .music-cover {
            height: 100%;
            width: 100%;
            border-radius: 10px;
        }

        .musics {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 180px;
            width: auto;
            height: 35vh;
            overflow: auto;
            gap: 20px;
            scrollbar-width: none;
        }

        .music-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scroll-btn {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
        }

        .scroll-btn:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        .scroll-btn:disabled {
            background-color: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .next-btn {
            background-color: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            margin: 0 10px;
        }

        .play-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(255, 255, 255);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            color: rgb(0, 0, 0);
            cursor: pointer;
        }

        .press-play {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            font-size: large;
            top: 67%;
            left: 70%;
            width: 45px;
            height: 45px;
            background-color: rgb(0, 255, 13);
            border-radius: 50%;
            border: none;
            color: rgb(0, 0, 0);
            cursor: pointer;
            /* Optional: add hover effect */
            opacity: 0;
            transition: 0.3s;
        }

        .music:hover .press-play {
            transform: translateY(-10px);
            opacity: 1;
        }

        #total-time {
            scrollbar-width: thin;
        }
        #progress-bar {
            width: 40%;
            height: 4px;
            background: linear-gradient(to right, #1DB954 0%, #1DB954 0%, #ec1f1f 0%, #ff0606 100%);
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            transition: background 0.2s linear;
        }


        #progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
                @media (max-width: 1270px) {
            .middle {
                width: 75%;
            }
            .contents{
                padding: 12px;
            }

            .search {
                width: 300px;
            }
            .footer{
                height: 10vh;
            }
        }

        @media (max-width: 1050px) {
            .middle {
                width: 75%;
            }
            .contents{
                padding: 12px;
            }
            .search {
                width: 200px;
            }
            .footer{
                height: 10vh;
            }
        }

        @media (max-width: 780px) {

            .logo {
                display: none;
                position: relative;
                max-width: 70px;
            }
            .contents{
                padding: 12px;
            }
            .slidebar {
                display: none;
            }

            .header {
                justify-content: center;
            }
            .middle{
                justify-content: center;
            }


            .contents {
                width: 100%;
                margin-left: 0;
            }


            .middle {
                width: 80%;
                margin-left: 0;
            }

            .search {
                max-width: 150px;
                padding: 8px;
            }

            .explore,
            .install {
                display: none;
            }

            .right {
                margin-right: 0px;
                margin-left: 10px;
            }

            .main-content {
                flex-direction: column;
            }
            .footer{
                justify-content: start;
                height: 20vh;
            }
            .footer-content{
                justify-content: center;
                margin-bottom: 20px;
            }
            .footer-right{
                display: none;
            }
            .footer-center{
                width: 60%;
            }
            .footer-left {
                display: flex;
            }
        }


    </style>
</head>

<body class="bg-black">
    <div class="container flex items-center">
        <div class="header flex items-center">
            <img src="Img/logo.svg" alt="Spotify Logo" class="logo invert">
            <div class="middle flex items-center">
                <div class="middle-first flex justify-center items-center">
                    <img src="Img/home.svg" alt="home" class="svg invert">
                    <div class="search justify-center items-center flex">
                        <img src="Img/search.svg" alt="search" class="invert svg-search">
                        <input type="text" id="input" placeholder="What do you want to listen?">
                    </div>
                </div>
                <div class="right flex items-center">
                    <button class="explore">Explore Premium</button>
                    <button class="install">Install App</button>
                    <img src="Img/notification-copy-svgrepo-com.svg" alt="" class="invert1 svg1">
                    <img src="Img/group-of-people-svgrepo-com.svg" alt="" class="invert1 svg1">
                    <h3 id="acc">P</h3>
                </div>
            </div>
        </div>
    </div>
    <div class="main-content flex">
        <div class="slidebar flex ">

            <div class="top flex items-center">
                <h3>Your Library</h3>
                <button class="create"><i class="fas fa-plus"></i> Create</button>
                <i class="fas fa-compress"></i>
            </div>

            <div class="options flex">
                <h3 class="option">Playlist</h3>
                <h3 class="option">Artists</h3>
            </div>

            <div class="recents flex items-center">
                <img src="Img/search.svg" alt="" class="svg-search invert1">
                <h3 class="recent flex items-center bg-grey">Recents <img src="Img/hamburger.svg" alt=""
                        class="invert "></h3>
            </div>

            <div class="artists flex">
                <ul>
                    <li class="artist">
                        <div class="cover">
                            <img src="songs/Angry_(mood)/cover.jpg" alt="" class="artist-cover">
                        </div>
                        <div class="description">
                            <h4>Niche Loyal</h4>
                            <p class="bg-grey">Artists</p>
                        </div>
                    </li>
                    <li class="artist">
                        <div class="cover">
                            <img src="songs/Funky_(mood)/cover.jpg" alt="" class="artist-cover">
                        </div>
                        <div class="description">
                            <h4>Artic Monkey</h4>
                            <p class="bg-grey">Artists</p>
                        </div>
                    </li>
                    <li class="artist">
                        <div class="cover">
                            <img src="songs/karan aujla/cover.jpg" alt="" class="artist-cover">
                        </div>
                        <div class="description">
                            <h4>Karan Aujla</h4>
                            <p class="bg-grey">Artists</p>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
        <div class="contents flex">
            <div class="content-header flex items-center">
                <h3 class="option">All</h3>
                <h3 class="option">Music</h3>
                <h3 class="option">Podcasts</h3>
            </div>
            <div class="spotify-musics">
                <div class="recommended flex">
                    <div class="music-header">
                        <h2>Recommended</h2>
                        <div class="scroll flex">
                            <button class="scroll-btn" id="leftBtn"><i class="fas fa-chevron-left"></i></button>
                            <button class="scroll-btn" id="rightBtn"><i class="fas fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div class="musics" id="musicContainer">
                        <!-- <div class="music">
                            <img src="songs/Bright_(mood)/cover.jpg" alt="" class="music-cover">
                            <p id="song-name">Bright Mood</p>
                            <p id="artist-name" class="bg-grey">Bille Ellish</p>
                        </div> -->

                    </div>
                </div>
                <div class="recommended flex">
                    <div class="music-header">
                        <h2>Popular Songs</h2>
                        <div class="scroll flex">
                            <button class="scroll-btn" id="leftBtn1"><i class="fas fa-chevron-left"></i></button>
                            <button class="scroll-btn" id="rightBtn1"><i class="fas fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <div class="musics" id="musicContainer1">
                        <!-- <div class="music">
                            <img src="songs/Dark_(mood)/cover.jpg" alt="" class="music-cover">
                            <button class="press-play"><i class="fas fa-play"></i></button>
                            <p id="song-name">Dark Mood</p>
                            <p id="artist-name" class="bg-grey">Kendrick Lamar</p>
                        </div> -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer flex items-center justify-center">
        <div class="footer-content flex items-center">
            <div class="footer-left flex">
                <h4 id="song-name">Song Name</h4>
                <!-- <p class="bg-grey" id="artist-name">Artist Name</p> -->
            </div>
            <div class="footer-center">
                <div class="controls">
                    <button class="next-btn" id="previous-song"><i class="fas fa-backward"></i></button>
                    <button class="play-btn"><i class="fas fa-play"></i></button>
                    <button class="next-btn" id="next-song"><i class="fas fa-forward"></i></button>
                </div>
                <div class="song-time">
                    <span id="current-time">0:00</span>
                    <input type="range" id="progress-bar" min="0" max="100" value="0">
                    <span id="total-time">3:30</span>
                </div>
            </div>
            <div class="footer-right">
                <img src="Img/volume.svg" alt="" class="invert">
                <input type="range" id="volume-slider" min="0" max="100" value="50">
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
