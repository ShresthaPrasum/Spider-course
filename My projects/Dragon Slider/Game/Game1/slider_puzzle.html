<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Slider Puzzle</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 20px; }
        #puzzle-container {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background-color: #34495e;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .tile {
            width: 100px;
            height: 100px;
            background-color: #e74c3c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s;
        }
        .tile:hover { background-color: #c0392b; }
        .empty {
            background-color: transparent;
            cursor: default;
        }
        .empty:hover { background-color: transparent; }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #2ecc71; }
        #message {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #f1c40f;
            height: 30px;
        }
    </style>
</head>
<body>

    <h1>Dragon Slider Puzzle</h1>
    <div id="puzzle-container"></div>
    <div id="message"></div>
    <button onclick="startGame()">Shuffle / Restart</button>

    <script src="puzzle.js"></script>
</body>
</html>
