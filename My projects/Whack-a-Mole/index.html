<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Section -->
        <div class="header">
            <h1>🔨 Whack-a-Mole 🔨</h1>
            <div class="stats-container">
                <div class="stat">
                    <span class="label">Score:</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="stat">
                    <span class="label">High Score:</span>
                    <span class="value" id="highScore">0</span>
                </div>
                <div class="stat">
                    <span class="label">Combo:</span>
                    <span class="value" id="combo">0</span>
                </div>
                <div class="stat">
                    <span class="label">Time:</span>
                    <span class="value" id="timer">60</span>s
                </div>
            </div>
        </div>

        <!-- Game Board Section -->
        <div class="game-board" id="gameBoard">
            <!-- Holes will be generated by JavaScript -->
        </div>

        <!-- Controls Section -->
        <div class="controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary" disabled>Restart</button>
            <button id="soundBtn" class="btn btn-sound">🔊 Sound ON</button>
        </div>

        <!-- Game Status Section -->
        <div class="status-message" id="statusMessage">Ready to play!</div>
    </div>

    <!-- Audio Elements (for sound effects) - Using Web Audio API -->
    <audio id="hitSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==" type="audio/wav">
    </audio>
    <audio id="missSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==" type="audio/wav">
    </audio>
    <audio id="gameOverSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==" type="audio/wav">
    </audio>

    <script src="script.js"></script>
</body>
</html>
