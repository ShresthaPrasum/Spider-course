<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: chewy;
            src: url(Chewy-Regular.ttf);
        }

        *{
            font-family: chewy;
            margin: 0;
            padding: 0;
        }
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .guess{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid black;
            padding: 40px 80px;
            border-radius: 20px;
            background-color: aliceblue;
            row-gap: 20px;
            font-size: 20px;
        }

        #guess{
            padding: 10px;
            font-size: 20px;
            border-radius: 10px;
            border: 2px solid black;
        }

    </style>
</head>
<body>
    <div class="guess">
        <h1>After a long time</h1>
        <h1>Guess the number</h1>

        <p>Think of a number between 1 and 100.</p>
        <input type="number" id="guess" placeholder="Guess the number">
        <p id="indicator">Below!</p>
        <p id="result"></p> 
    </div>

    <script>

        let attempts = 0;

        let rand = Math.floor(Math.random()*99+1);
        console.log(rand);

        let result = document.getElementById('result')

        let input = document.getElementById("guess");

        let indicator = document.getElementById('indicator');

        input.addEventListener("keydown", function checktheinput(){
            if (event.key === 'Enter') { 
                let number = parseInt(input.value);
                if(number){
                    attempts++;

                    if(number<rand){
                        indicator.innerHTML = "Above!" 
                        result.innerHTML = "You did "+ attempts + " attempts but still didn't win!";
                    }
                    else if(number>rand){
                        indicator.innerHTML = "Below!" 
                        result.innerHTML = "You did "+ attempts + " attempts but still didn't win!";
                    }
                    else if(number == rand){
                        indicator.innerHTML = `${rand} is the correct number!`
                        result.innerHTML = "You won in " + attempts + " attempts!";
                    }
                    else{
                        indicator.innerHTML = "MEHH"
                        result.innerHTML = "Y u so g#y";
                    }
                }
            }
        })
        document.addEventListener("keydown", function checktheinput(){
            if (event.key === 'Enter') { 
                input.value = "";
            }
            if(event.key === 'r' || event.key === 'R'){
                location.reload();
            }
            if(event.key === 'f' || event.key === 'F'){
                window.open("https://www.facebook.com/@prasum.shrestha.2025", "_blank", "noopener,noreferrer");
            }
            if(event.key === 'I' || event.key === 'i'){
                window.open("https://www.instagram.com/prasum_shrestha", "_blank", "noopener,noreferrer");
            }
            if(event.key === 'G' || event.key === 'g'){
                window.open("https://www.github.com/ShresthaPrasum", "_blank", "noopener,noreferrer");
            }
        })
    </script>
</body>
</html>
