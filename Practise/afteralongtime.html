<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .guess{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid black;
            padding: 40px 80px;
            border-radius: 20px;
            background-color: aliceblue;
        }

    </style>
</head>
<body>
    <div class="guess">
        <h1>After a long time</h1>
        <h1>Guess the number</h1>

        <p>Think of a number between 1 and 100.</p>
        <input type="number" id="guess" placeholder="Guess the number">
        <p id="indicator">Below!</p>
        <p id="result"></p> 
    </div>

    <script>

        let attempts = 0;

        let rand = Math.floor(Math.random()*99+1);
        console.log(rand);

        let result = document.getElementById('result')

        let input = document.getElementById("guess");

        let indicator = document.getElementById('indicator');

        input.addEventListener("keydown", function checktheinput(){
            if (event.key === 'Enter') { 
                let number = parseInt(input.value);
                if(number){
                    attempts++;

                    if(number<rand){
                        indicator.innerHTML = "Above!" 
                        result.innerHTML = "You did "+ attempts + " attempts but still didn't win!";
                    }
                    else if(number>rand){
                        indicator.innerHTML = "Below!" 
                        result.innerHTML = "You did "+ attempts + " attempts but still didn't win!";
                    }
                    else if(number == rand){
                        indicator.innerHTML = "That's it!"
                        result.innerHTML = "You won in " + attempts + " attempts!";
                    }
                    else{
                        indicator.innerHTML = "MEHH"
                        result.innerHTML = "Y u so g#y";
                    }
                }
            }
        })
    </script>
</body>
</html>
